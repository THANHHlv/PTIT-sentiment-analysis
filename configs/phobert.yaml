checkpoint: vinai/phobert-base
revision: main  # Ghim commit cụ thể trước thực nghiệm chính thức.
max_length: 256
segmenter_dir: tools/vncorenlp
seed: 42
training:
  num_train_epochs: 3
  per_device_train_batch_size: 8
  per_device_eval_batch_size: 8
  learning_rate: 0.00002
  weight_decay: 0.01
  warmup_ratio: 0.1
  gradient_accumulation_steps: 1
  fp16: false
  use_cpu: false
