# Fixed before test evaluation; reuse NV2 preprocessing without changing labels/splits.
preprocessing:
  lowercase: true
  replace_urls: true
  expand_slang: true
  mask_sensitive: true
  slang_map: {ko: "không", k: "không", khum: "không", hok: "không", dc: "được", đc: "được", mn: "mọi người", sv: "sinh viên"}
  emoji: keep
  stop_words: []
  tokenizer: underthesea
vectorizer:
  min_df: 1
  max_df: 1.0
  max_features: 20000
grid:
  ngram_range: [[1, 1], [1, 2]]
  nb_alpha: [0.1, 0.5, 1.0]
  svm_c: [0.1, 1.0, 10.0]
svm:
  max_iter: 10000
  retry_max_iter: 100000
  tol: 0.0001
seed: 42
