split:
  ratios: [0.70, 0.15, 0.15]
  seed: 42
  attempts: 2000
preprocessing:
  lowercase: true
  replace_urls: true
  expand_slang: true
  mask_sensitive: true
  slang_map: {ko: "không", khum: "không", hok: "không"} # k/dc/đc/mn/sv cần rà ngữ cảnh
  emoji: keep   # keep / keep_and_map / map / remove
  stop_words: []
  tokenizer: underthesea
vectorizer:
  min_df: 1
  max_df: 1.0
  max_features: 20000
grid:
  ngram_range: [[1, 1], [1, 2]]
  # (1, 3) chỉ thử khi train đủ lớn và validation cho thấy có ích.
  emoji: [keep, keep_and_map]
  svm_class_weight: [null, balanced]
  nb_alpha: [0.5, 1.0]
  svm_c: [0.5, 1.0]
seed: 42
