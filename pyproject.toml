[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ptit-sentiment"
version = "0.1.0"
description = "Phân loại cảm xúc bình luận sinh viên PTIT"
requires-python = ">=3.10,<3.13"
dependencies = [
  "scikit-learn>=1.5,<1.8", "pandas>=2.2,<3", "numpy>=1.26,<3",
  "PyYAML>=6,<7", "joblib>=1.3,<2", "matplotlib>=3.8,<4",
  "underthesea>=6.8,<10",
]

[project.optional-dependencies]
phobert = ["torch>=2.2,<3", "transformers==4.44.2", "accelerate>=0.33,<1", "py-vncorenlp==0.1.4"]

[tool.setuptools.packages.find]
where = ["src"]
